document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;try{let a=b.dataset.action;if(a==='page'){page=b.dataset.page;selected='';render();}else if(a==='customer'){selected=summary(data)[Number(b.dataset.index)].key;render();}else if(a==='back'){selected='';render();}else if(a==='filter'){filter=b.dataset.filter;render();}else if(a==='import')showImport();else if(a==='receipt')showReceipt();else if(a==='close')close();else if(a==='export')exportCSV();else if(a==='preview'){pending=importOrders($('#raw').value);if(!pending.orders.length)throw Error('Không có đơn hợp lệ từ 19/10/2026');$('#modal-error').textContent='';$('#preview').innerHTML=`<div class="preview"><strong>${pending.orders.length} đơn · ${fmt(pending.orders.reduce((s,o)=>s+o.amount,0))}</strong><p>Bỏ qua ${pending.skipped} dòng trước kỳ hoặc trống.</p><button class="button primary" data-action="apply">Lưu đơn hàng vào sổ</button></div>`;}else if(a==='apply'){if(!pending)throw Error('Hãy kiểm tra dữ liệu trước');mutate(d=>{let m=new Map(d.orders.map(o=>[o.id,o]));for(let o of pending.orders){let old=m.get(o.id);if(old&&old.customer!==o.customer)throw Error('Mã đơn '+o.id+' đang thuộc khách khác. Hãy đối soát tên khách.');m.set(o.id,{...o,due:old?.due||null});if(!old||old.amount!==o.amount)d.verified[o.customer]=false;}d.orders=[...m.values()];d.importedAt=new Date().toISOString();},'Đã cập nhật đơn hàng, không cộng trùng mã đơn.');close();}else if(a==='verify'){mutate(d=>{d.verified[selected]=!d.verified[selected]},'Đã cập nhật trạng thái đối soát');}else if(a==='void'){let p=data.receipts[Number(b.dataset.index)];if(confirm('Hủy phiếu thu '+fmt(p.amount)+'? Phiếu vẫn được giữ trong lịch sử.'))mutate(d=>{d.receipts[Number(b.dataset.index)].voided=new Date().toISOString();d.verified[p.customer]=false;},'Đã hủy phiếu thu');}else if(a==='backup'){download('sao-luu-cong-no-'+today()+'.json',JSON.stringify({format:'so-cong-no',version:1,savedAt:new Date().toISOString(),data},null,2),'application/json');}else if(a==='restore'){modal('Khôi phục sổ công nợ','<p>Khôi phục sẽ thay thế toàn bộ sổ trên trình duyệt này. Hãy tải bản sao lưu hiện tại trước khi tiếp tục.</p><label class="file-input">Chọn bản sao lưu JSON<input id="restorefile" type="file" accept=".json"></label><div id="restore-preview"></div>');}else if(a==='restore-apply'){if(!pending?.restore)throw Error('Chưa chọn bản sao lưu');if(confirm('Thay thế sổ hiện tại bằng bản sao lưu đã chọn?')){commit(pending.restore,'Đã khôi phục sổ');close();}}else if(a==='help'){modal('Hướng dẫn sử dụng',`<ol class="help"><li>Đưa file này lên GitHub với tên <b>index.html</b>, bật GitHub Pages cho nhánh chứa file. Cũng có thể mở file trực tiếp để dùng thử.</li><li>Ứng dụng tự đọc tab Đơn hàng từ Google Sheets khi mở trang và mỗi 60 giây khi trang đang hiển thị. Nút Cập nhật đơn hàng lấy ngay dữ liệu mới. Nguồn phải cho phép xem bằng liên kết.</li><li>Chỉ lấy đơn từ 19/10/2026. Nợ đầu kỳ bằng 0; nợ trước ngày này không tính.</li><li>Ghi đủ khoản đã thu từ mốc bắt đầu. Bấm tên khách để xem đơn, nhập hạn trả và xác nhận đối soát.</li><li>Khi nguồn phát sinh đơn từ 19/10/2026, ứng dụng tự gộp sản phẩm theo mã đơn và cộng nợ vào khách. Cập nhật lại cùng mã đơn không cộng trùng. Đơn bị xóa khỏi nguồn vẫn được giữ để đối soát; đổi khách của đơn sẽ báo lỗi để tránh ghép nhầm khoản thu.</li><li>Dữ liệu lưu trên trình duyệt hiện tại, không đồng bộ giữa các máy. Dùng Sao lưu JSON và Khôi phục để chuyển máy.</li><li>Trang HTML không chứa dữ liệu đơn hàng của bạn. Đừng tải các tệp sao lưu chứa dữ liệu kinh doanh lên kho GitHub công khai.</li></ol>`);}}catch(e){message(e);}});

document.addEventListener('change',async e=>{try{let t=e.target;if(t.id==='csvfile'){let f=t.files[0];if(f){if(f.size>3000000)throw Error('Tệp tối đa 3 MB');$('#raw').value=await f.text();pending=null;$('#preview').innerHTML='';}}else if(t.dataset.order!==undefined){let i=Number(t.dataset.order),v=t.value?date(t.value):null;if(v&&v<data.orders[i].date)throw Error('Hạn trả phải từ ngày đơn trở đi');mutate(d=>{d.orders[i].due=v;});}else if(t.id==='restorefile'){pending=null;$('#restore-preview').innerHTML='';let f=t.files[0];if(!f)return;if(f.size>15000000)throw Error('Tệp sao lưu tối đa 15 MB');let b=JSON.parse(await f.text());if(b.format!=='so-cong-no'||b.version!==1)throw Error('Không đúng định dạng sao lưu sổ công nợ');let restored=validate(b.data);pending={restore:restored};$('#restore-preview').innerHTML=`<div class="preview"><strong>${restored.orders.length} đơn · ${restored.receipts.length} phiếu thu</strong><p>Thao tác sẽ thay thế dữ liệu sổ hiện tại.</p><button class="button primary" data-action="restore-apply">Khôi phục và thay thế sổ</button></div>`;}}catch(e){message(e);}});

function tableOrders(table){
 if(!table||!Array.isArray(table.cols)||!Array.isArray(table.rows))throw Error('Google Sheets trả về dữ liệu không hợp lệ.');
 let cols=Object.fromEntries(table.cols.map((c,i)=>[String(c.label||'').trim(),i]));
 for(let h of ['Số','Ngày','Đối tượng','Nội dung','Tổng tiền'])if(cols[h]===undefined)throw Error('Nguồn thiếu cột '+h+'. Hãy giữ tiêu đề tab Đơn hàng.');
 let map=new Map(),skipped=0;
 for(let [i,row] of table.rows.entries()){
  const val=h=>row.c?.[cols[h]]?.v;
  let id=String(val('Số')??'').trim();if(!id){skipped++;continue;}
  try{
   let rawDate=val('Ngày'),m=typeof rawDate==='string'&&rawDate.match(/^Date\((\d+),(\d+),(\d+)(?:,.*)?\)$/);
   let d=m?date(`${m[1]}-${String(Number(m[2])+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`):date(row.c?.[cols['Ngày']]?.f||String(rawDate||''));
   if(d<START){skipped++;continue;}
   let name=String(val('Đối tượng')??'').trim();if(!name)throw Error('Thiếu tên khách');
   let rawAmount=val('Tổng tiền');if(rawAmount===undefined||rawAmount===null||rawAmount==='')throw Error('Thiếu Tổng tiền');
   let amount=money(rawAmount);
   let customer=customerKey(name),o=map.get(id);
   if(o&&(o.customer!==customer||o.date!==d))throw Error('Mã đơn có ngày hoặc khách không thống nhất');
   if(!o){o={id,date:d,customer,name,staff:String(val('Nhân viên')||''),warehouse:String(val('Kho')||''),amount:0,due:null,items:[]};map.set(id,o);}
   o.amount+=amount;if(!Number.isSafeInteger(o.amount))throw Error('Tổng tiền vượt giới hạn');
   o.items.push({name:String(val('Nội dung')||''),qty:String(val('Số lượng')??''),amount});
  }catch(e){throw Error('Dòng nguồn '+(i+2)+': '+e.message);}
 }
 for(let o of map.values())if(o.amount<0)throw Error('Tổng đơn '+o.id+' âm, cần đối soát riêng trước khi cập nhật.');
 return {orders:[...map.values()],skipped};
}
function readSource(){return new Promise((resolve,reject)=>{
 let cb='__congNoSource'+(++syncSequence),script=document.createElement('script'),settled=false;
 const finish=(err,result)=>{if(settled)return;settled=true;clearTimeout(timeout);script.remove();delete window[cb];err?reject(err):resolve(result);};
 const timeout=setTimeout(()=>finish(Error('Không đọc được Google Sheets trong 25 giây. Kiểm tra mạng và quyền xem bằng liên kết của nguồn.')),25000);
 window[cb]=result=>{if(result.status!=='ok'){finish(Error(result.errors?.map(e=>e.detailed_message||e.message).join('; ')||'Google Sheets từ chối đọc dữ liệu.'));return;}finish(null,result.table);};
 script.onerror=()=>finish(Error('Chưa kết nối được nguồn đơn hàng. Kiểm tra mạng hoặc quyền xem của Google Sheets.'));
 let url=new URL(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`);
 url.searchParams.set('gid',SHEET_GID);url.searchParams.set('headers','1');url.searchParams.set('tqx','out:json;responseHandler:'+cb);url.searchParams.set('tq','select *');url.searchParams.set('_',String(Date.now()));
 script.src=url.href;document.head.appendChild(script);
});}
function syncUI(){let strip=$('.source-strip');if(!strip)return;let strong=strip.querySelector('strong'),label=strong?.nextElementSibling;
 if(strong)strong.textContent='Nguồn trực tiếp: Đơn hàng · Tồn - Giá';
 if(label)label.textContent=syncState.busy?'Đang đọc đơn hàng từ Google Sheets…':syncState.error?'Cập nhật thất bại — đang giữ số liệu lần trước':syncState.last?'Đã kiểm tra '+syncState.last.toLocaleTimeString('vi-VN')+' · '+syncState.message+' · Tự kiểm tra mỗi 60 giây':'Tự lấy đơn từ 19/10/2026 · Kiểm tra mỗi 60 giây khi mở trang';
 let button=$('[data-action="sync"]');if(button){button.disabled=syncState.busy;button.textContent=syncState.busy?'⟳ Đang cập nhật…':'⟳ Cập nhật đơn hàng';}
 let alert=$('#sync-alert');if(!alert){alert=document.createElement('div');alert.id='sync-alert';strip.after(alert);}alert.replaceChildren();
 if(syncState.error){let box=document.createElement('div');box.className='alert error';box.textContent='Chưa cập nhật nguồn: '+syncState.error+' Số dư đang hiển thị có thể chưa gồm đơn mới.';alert.append(box);}
}
async function syncSource(){if(syncState.busy)return;syncState.busy=true;syncState.error='';syncUI();try{
 let result=tableOrders(await readSource());
 if(!result.orders.length)throw Error('Nguồn chưa có đơn từ 19/10/2026. Chưa thay đổi sổ đang lưu.');
 let next=JSON.parse(JSON.stringify(data)),map=new Map(next.orders.map(o=>[o.id,o])),changed=false,newCount=0;
 for(let o of result.orders){let old=map.get(o.id);if(old&&old.customer!==o.customer)throw Error('Mã đơn '+o.id+' đã đổi khách. Cần kiểm tra trước để không ghép nhầm phiếu thu.');let updated={...o,due:old?.due||null};if(!old)newCount++;if(!old||['date','customer','name','staff','warehouse','amount','due'].some(k=>old[k]!==updated[k])||JSON.stringify(old.items)!==JSON.stringify(updated.items)){changed=true;if(!old||old.amount!==o.amount)next.verified[o.customer]=false;}map.set(o.id,updated);}
 next.orders=[...map.values()];
 if(changed){next.importedAt=new Date().toISOString();commit(next,`Đã lấy ${result.orders.length} đơn từ nguồn${newCount?' · '+newCount+' đơn mới':''}. Đã cộng vào công nợ theo khách.`);}
 syncState.last=new Date();syncState.message=result.orders.length+' đơn trong kỳ';
}catch(e){syncState.error=e.message||String(e);}finally{syncState.busy=false;syncUI();}}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="sync"]'))syncSource();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSource();});
setInterval(()=>{if(!document.hidden)syncSource();},60000);
// Preserve live connection status when local receipt and filter actions redraw the screen.
const renderLedger=render;
render=function(){renderLedger();syncUI();};
render();syncSource();

</script></body></html>
